# Черновик. Два сервиса — ровно то, что решили в ARCHITECTURE.md п.2:
# модель эмбеддингов отдельно от кода приложения, веса в независимом
# именованном volume, чтобы правки Dockerfile/кода никогда не приводили
# к повторному скачиванию весов.

services:
  embeddings:
    # cpu-* тег — уже самый лёгкий вариант образа TEI (без CUDA-библиотек,
    # они нам не нужны без GPU). Версия закреплена (см. GitHub releases
    # huggingface/text-embeddings-inference, сверено на сентябрь 2026).
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8.1
    command: ["--model-id", "intfloat/multilingual-e5-base"]
    volumes:
      - model-cache:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      # Проверено вживую: первая загрузка весов + прогрев занимает ~120-165с
      # на нашей машине/сети — запас 60s+10×10s=160s уже проигрывал гонку на
      # несколько секунд в одном из прогонов. На медленном интернете/железе
      # (не наш случай, но реальный сценарий) это может занять кратно дольше.
      # Проверки идут каждые interval и во время start_period — как только
      # одна из них успешна, статус становится healthy сразу, не дожидаясь
      # конца start_period. Значит щедрый запас ничего не стоит на быстром
      # окружении, только расширяет терпение к реально медленному/сломанному.
      start_period: 900s

  app:
    build: ./app  # build context — только app/, не корень репо (см. app/.dockerignore)
    depends_on:
      embeddings:
        condition: service_healthy
    environment:
      - EMBEDDINGS_URL=http://embeddings:80
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    # переопределить для evaluate.py:
    #   docker compose run app python evaluate.py

volumes:
  model-cache:
